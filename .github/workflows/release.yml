name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build extension jar
        working-directory: java-extension
        run: ./gradlew assemble --no-daemon

      - name: Name release asset
        id: asset
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          src="java-extension/build/libs/otel-java-extension-1.0-all.jar"
          dest="otel-java-extension-${tag}-all.jar"
          test -f "$src"
          cp "$src" "$dest"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "file=${dest}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset.outputs.tag }}
          name: ${{ steps.asset.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.asset.outputs.file }}
            java-extension/build/libs/otel-java-extension-1.0-all.jar
